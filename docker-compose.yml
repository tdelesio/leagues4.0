version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: leagues-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: leagues_mono
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7.0-alpine
    container_name: leagues-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
