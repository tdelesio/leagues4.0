<div class="players-container">
    <div class="row" style="margin-bottom: 20px;">
        <div class="col-md-6">
            <h3 style="margin-top: 0; color: #fff;">Registered Players ({{(players | filter:searchText).length}})</h3>
        </div>
        <div class="col-md-6">
            <div class="input-group">
                <span class="input-group-addon" style="background-color: #222; border-color: #444; color: #aaa;"><i class="fa fa-search"></i></span>
                <input type="text" class="form-control" placeholder="Search players, emails or leagues..." ng-model="searchText" style="background-color: #111; color: #fff; border-color: #444;">
            </div>
        </div>
    </div>

    <div class="table-responsive" style="border: none;">
        <table class="table table-striped table-hover" style="color: #ccc; border: 1px solid rgba(255, 255, 255, 0.05);">
            <thead>
                <tr style="background-color: #181818; border-bottom: 2px solid #333;">
                    <th style="color: #aaa; border: none; padding: 12px 15px;">Username</th>
                    <th style="color: #aaa; border: none; padding: 12px 15px;">Email</th>
                    <th style="color: #aaa; border: none; padding: 12px 15px;">Leagues</th>
                    <th style="color: #aaa; border: none; padding: 12px 15px; text-align: center; width: 160px;">Venmo ID</th>
                    <th style="color: #aaa; border: none; padding: 12px 15px; text-align: center; width: 100px;">Paid?</th>
                    <th style="color: #aaa; border: none; padding: 12px 15px; text-align: center; width: 140px;">Admin Status</th>
                    <th style="color: #aaa; border: none; padding: 12px 15px; text-align: center; width: 120px;">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="player in players | filter:searchText" style="border-bottom: 1px solid #222;">
                    <td style="padding: 12px 15px; border-color: #222; vertical-align: middle;">
                        <strong style="color: #FFB415; font-size: 15px;">{{player.username}}</strong>
                    </td>
                    <td style="padding: 12px 15px; border-color: #222; vertical-align: middle;">
                        <a href="mailto:{{player.email}}" style="color: #aaa; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='#FFB415'" onmouseout="this.style.color='#aaa'">
                            <i class="fa fa-envelope-o" style="margin-right: 6px; color: #FFB415;"></i>{{player.email}}
                        </a>
                    </td>
                    <td style="padding: 12px 15px; border-color: #222; vertical-align: middle;">
                        <span ng-if="player.leagues.length === 0" style="color: #666; font-style: italic;">No leagues joined</span>
                        <div class="league-pills" style="display: flex; flex-wrap: wrap; gap: 6px;">
                            <span ng-repeat="league in player.leagues" class="label label-primary" style="background-color: rgba(51, 122, 183, 0.15); color: #9bc5ff; border: 1px solid rgba(51, 122, 183, 0.3); font-size: 12px; margin-right: 4px; padding: 4px 8px; display: inline-block; border-radius: 4px; font-weight: normal;">
                                {{league}}
                            </span>
                        </div>
                    </td>
                    <td style="padding: 12px 15px; border-color: #222; text-align: center; vertical-align: middle;">
                        <input type="text" class="form-control" ng-model="player.venmoId" ng-blur="updatePlayer(player)" placeholder="@venmo_id" style="background-color: #111; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 4px 8px; text-align: center; font-size: 13px; display: inline-block; width: 100%; max-width: 130px;" />
                    </td>
                    <td style="padding: 12px 15px; border-color: #222; text-align: center; vertical-align: middle;">
                        <input type="checkbox" ng-model="player.paid" ng-change="updatePlayer(player)" style="width: 20px; height: 20px; cursor: pointer; accent-color: #FFB415; margin: 0 auto; display: block;" />
                    </td>
                    <td style="padding: 12px 15px; border-color: #222; text-align: center; vertical-align: middle;">
                        <span ng-if="player.admin" class="label label-warning" style="background-color: rgba(240, 173, 78, 0.15); color: #f0ad4e; border: 1px solid rgba(240, 173, 78, 0.3); font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 500; display: inline-block;">
                            <i class="fa fa-star" style="margin-right: 4px;"></i>Admin
                        </span>
                        <span ng-if="!player.admin" class="label label-default" style="background-color: rgba(255, 255, 255, 0.05); color: #777; border: 1px solid rgba(255, 255, 255, 0.08); font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: normal; display: inline-block;">
                            User
                        </span>
                    </td>
                    <td style="padding: 12px 15px; border-color: #222; text-align: center; vertical-align: middle;">
                        <button ng-click="resetPassword(player)" class="btn btn-xs" style="background-color: rgba(240, 173, 78, 0.1); border: 1px solid rgba(240, 173, 78, 0.3); color: #f0ad4e; padding: 4px 10px; border-radius: 4px; font-weight: 500; transition: all 0.2s; margin-right: 6px;" onmouseover="this.style.backgroundColor='#f0ad4e'; this.style.color='#fff'" onmouseout="this.style.backgroundColor='rgba(240, 173, 78, 0.1)'; this.style.color='#f0ad4e'">
                            <i class="fa fa-key" style="margin-right: 4px;"></i>Reset
                        </button>
                        <button ng-click="deletePlayer(player)" ng-if="player.username !== currentUser" class="btn btn-xs" style="background-color: rgba(217, 83, 79, 0.1); border: 1px solid rgba(217, 83, 79, 0.3); color: #d9534f; padding: 4px 10px; border-radius: 4px; font-weight: 500; transition: all 0.2s;" onmouseover="this.style.backgroundColor='#d9534f'; this.style.color='#fff'" onmouseout="this.style.backgroundColor='rgba(217, 83, 79, 0.1)'; this.style.color='#d9534f'">
                            <i class="fa fa-trash-o" style="margin-right: 4px;"></i>Delete
                        </button>
                    </td>
                </tr>
                <tr ng-if="loading">
                    <td colspan="7" style="text-align: center; padding: 40px; background-color: transparent;">
                        <i class="fa fa-spinner fa-spin fa-2x" style="color: #FFB415; margin-bottom: 10px;"></i>
                        <p style="color: #888; margin: 0; font-size: 14px;">Retrieving registered players list...</p>
                    </td>
                </tr>
                <tr ng-if="!loading && (players | filter:searchText).length === 0">
                    <td colspan="7" style="text-align: center; padding: 40px; color: #666; font-style: italic; background-color: transparent;">
                        <i class="fa fa-users" style="font-size: 24px; color: #444; margin-bottom: 10px; display: block;"></i>
                        No registered players found matching your query.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
