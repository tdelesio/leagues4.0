<div> 
	<h2>Games</h2> 
	<div class="jumbotron"> 
		<div class="container" ng-controller="SetupWeekController as setupCtrl"> 
			
			<!-- Season and Week Quick Selectors -->
			<div class="well">
				<form class="form-inline">
					<div class="form-group" style="margin-right: 20px;">
						<label for="games-season-select" style="margin-right: 10px;">Season:</label>
						<select ng-model="add_game_model.seasonId" required id="games-season-select" class="form-control" ng-change="changeSeason()">
							<option ng-repeat="season in seasons" value="{{season.id}}">
								{{season.leagueType}} ({{season.startYear}} - {{season.endYear}})
							</option>
						</select>
					</div>
					<div class="form-group">
						<label for="games-week-select" style="margin-right: 10px;">Week:</label>
						<select ng-model="add_game_model.weekId" id="games-week-select" class="form-control" ng-change="changeWeek()">
							<option ng-repeat="week in weeks" value="{{week.id}}">
								{{week.weekNumber}}
							</option>
						</select>
					</div>
				</form>
			</div>

			<hr/>
			
			<!-- Games Table List -->
			<games></games>
			
			<!-- Game Editor Block (Displays inline when showEdit is true) -->
			<edit-game></edit-game>
			
			<hr/>
			
			<!-- Auto Scoring Button -->
			<div class="row">
				<div class="col-lg-12">
					<a href="" ng-click="setupCtrl.autoScore(week)" class="btn btn-primary">Auto Score Week</a>
				</div>
			</div>
			
		</div> 
	</div> 
</div>
