<div ng-controller="ViewPicksController" class="view-picks-wrapper">
	<h3 style="color: #FFB415; margin-bottom: 20px; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase; font-size: 18px;">
		<i class="fa fa-th-list"></i> Player Picks Matrix
	</h3>
	
	<div ng-if="loading" class="text-center" style="padding: 50px;">
		<i class="fa fa-spinner fa-spin fa-3x" style="color: #FFB415;"></i>
		<p style="color: #fff; margin-top: 15px;">Loading picks matrix...</p>
	</div>

	<div ng-if="!loading && viewPicksGrid.length > 0" class="table-responsive glass-table-container">
		<table class="table table-bordered picks-matrix-table">
			<thead>
				<tr ng-repeat="row in [viewPicksGrid[0]]">
					<th ng-repeat="col in row" class="text-center header-cell">
						{{col.value}}
					</th>
				</tr>
			</thead>
			<tbody>
				<tr ng-repeat="row in viewPicksGrid" ng-if="!$first">
					<td ng-repeat="col in row" class="text-center pick-cell" ng-class="col.attribute">
						{{col.value}}
					</td>
				</tr>
			</tbody>
		</table>
	</div>

	<div ng-if="!loading && viewPicksGrid.length === 0" class="text-center" style="padding: 50px;">
		<p style="color: #ccc; font-size: 16px;">No picks found or games scheduled for this week.</p>
	</div>
</div>
