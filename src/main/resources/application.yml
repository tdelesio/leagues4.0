server:
  port: 8080
  error:
    include-message: always

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/leagues_mono?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: dbuser
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  
  redis:
    host: localhost
    port: 6379

logging:
  level:
    org.springframework.security: INFO
    com.makeurpicks: DEBUG
